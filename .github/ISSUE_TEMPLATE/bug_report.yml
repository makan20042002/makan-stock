name: Bug report / گزارش اشکال
description: Report a reproducible problem using synthetic or redacted data.
title: "[Bug]: "
body:
  - type: input
    id: version
    attributes:
      label: Version and distribution / نسخه و نوع بسته
      placeholder: "1.3.0, Setup or Portable"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / مراحل تکرار
      description: Use sample data. Never attach customer databases, passwords or keys.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result / نتیجه مورد انتظار و نتیجه فعلی
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Windows, browser, language and screenshots / محیط اجرا
      description: Remove personal and customer information from screenshots.
