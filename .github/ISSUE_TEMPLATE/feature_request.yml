name: Feature request / پیشنهاد قابلیت
description: Suggest an inventory workflow improvement.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today? / چه کاری دشوار است؟
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / پیشنهاد شما
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context / راه‌حل جایگزین و توضیحات
